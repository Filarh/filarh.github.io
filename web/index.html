<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Portafolio de Emilio Rivera construido en Flutter">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emilio Rivera | Portafolio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/Icon-192.png">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0d0d0f;
        color: #f5f5f5;
        font-family: 'Roboto', sans-serif;
        height: 100%;
        width: 100%;
      }

      #flutter_container {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="flutter_container"></div>
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        if (window._flutter) {
          window._flutter.loader.loadEntrypoint().then(function (engineInitializer) {
            return engineInitializer.initializeEngine({hostElement: document.querySelector('#flutter_container')});
          }).then(function (appRunner) {
            return appRunner.runApp();
          });
        }
      });
    </script>
  </body>
</html>
